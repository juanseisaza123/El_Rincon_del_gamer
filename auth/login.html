<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - ERG | El Rincón Del Gamer</title>
    <link rel="stylesheet" href="assets/css/login.css">
</head>

<body>
    <!-- Fondos dinámicos coloridos y gamer -->
    <div class="cyber-grid"></div>
    <div class="bg-shape shape-red"></div>
    <div class="bg-shape shape-orange"></div>
    <div class="bg-shape shape-cyan"></div>
    <div class="bg-shape shape-purple"></div>

    <!-- Logos flotantes masivos generados por JS -->
    <div class="floating-elements" id="floatingElements"></div>

    <div class="login-container">
        <h1>Iniciar sesión</h1>
        <p class="terms-text">
            Al continuar, aceptas nuestro <a href="#" class="link">Acuerdo del usuario</a> y confirmas que has entendido
            la <a href="#" class="link">Política de privacidad</a>.
        </p>

        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="email" placeholder="Correo electrónico*" autocomplete="email" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Contraseña*" autocomplete="current-password" minlength="6" required>
            </div>

            <div class="form-footer">
                <p class="register-text" id="registerPrompt">
                    ¿Es tu primera vez en ERG? <a href="#" class="link">Regístrate</a>
                </p>
                <p class="register-text" id="loginPrompt" hidden>
                    ¿Ya tienes cuenta? <a href="#" class="link">Inicia sesión</a>
                </p>
            </div>

            <button type="submit" class="btn-submit">
                <span>Iniciar sesión</span>
            </button>
            <p id="authMessage" role="status" aria-live="polite"></p>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/lib/supabaseClient.js"></script>
    <script src="assets/js/login.js"></script>
</body>

</html>
